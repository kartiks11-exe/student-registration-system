<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
  <h2 class="text-primary">Student Database</h2>
  <a routerLink="/add-student" class="btn btn-primary">+ Add New Student</a>
</div>

<div class="card shadow-sm border-primary">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="bg-primary text-white">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Age</th>
          <th class="text-center">Action</th>
        </tr>
      </thead>
      <tbody>
        @for (s of students; track s.id) {
          <tr>
            <td>{{s.id}}</td>
            <td>{{s.name}}</td>
            <td>{{s.email}}</td>
            <td>{{s.course}}</td>
            <td>{{s.age}}</td>
            <td class="text-center">
              <a [routerLink]="['/edit-student', s.id]" class="btn btn-sm btn-outline-primary me-2">Edit</a>
              <button class="btn btn-sm btn-outline-danger" (click)="onDelete(s.id)">Delete</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="text-center py-4">No students found in the database.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
