<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">{{ isEditMode ? 'Edit Student Record' : 'Add New Student' }}</h4>
      </div>
      <div class="card-body p-4">
        @if (errorMessage) {
          <div class="alert alert-danger">{{errorMessage}}</div>
        }
        <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
          
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" formControlName="name">
          </div>

          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" formControlName="email">
          </div>

          <div class="mb-3">
            <label class="form-label">Course</label>
            <input type="text" class="form-control" formControlName="course">
          </div>

          <div class="mb-3">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" formControlName="age">
          </div>

          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" formControlName="phone">
          </div>

          <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" formControlName="address" rows="2"></textarea>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary" [disabled]="studentForm.invalid">
              {{ isEditMode ? 'Update Records' : 'Save Student' }}
            </button>
            <a routerLink="/students" class="btn btn-outline-secondary">Back to List</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
